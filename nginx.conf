# The blog is built with vite base "/blog/" (it mirrors the GitHub Pages
# project-site path under kdbrian.github.io/blog). Serve it under that same
# subpath here so built asset URLs resolve the same way locally as in prod.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /blog/;
    }

    location /blog/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /blog/index.html;
    }

    location = /blog/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache";
    }
}
